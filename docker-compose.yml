# FAERS Analytics Platform — Docker Compose
# Requires Docker Compose v2 (ships with Docker Desktop 3.3+)

# ──────────────────────────────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────────────────────────────
networks:
  # Internal network — api, frontend, postgres, redis talk here.
  # Never exposed to the host.
  internal:
    driver: bridge

  # Edge network — only Caddy sits on this side AND on internal.
  # Keeps the DB/cache completely unreachable from outside.
  edge:
    driver: bridge

services:

  # ----------------------------------------------------------------
  # PostgreSQL — Primary database
  # ----------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: faers_postgres
    restart: unless-stopped
    networks:
      - internal
    # No ports exposed to the host — reachable only on the internal network
    environment:
      POSTGRES_DB: faers
      POSTGRES_USER: faers_user
      POSTGRES_PASSWORD: faers_secret_pw
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/materialized_views.sql:/docker-entrypoint-initdb.d/02_views.sql
    command: >
      postgres
        -c shared_buffers=1GB
        -c effective_cache_size=3GB
        -c maintenance_work_mem=512MB
        -c work_mem=64MB
        -c max_parallel_workers_per_gather=4
        -c max_parallel_workers=8
        -c wal_level=replica
        -c max_wal_size=4GB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c statement_timeout=10000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faers_user -d faers"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # Redis — Query result cache
  # ----------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: faers_redis
    restart: unless-stopped
    networks:
      - internal
    # No ports exposed to the host
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # FAERS API — FastAPI backend (production image)
  # ----------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: faers-api:prod
    container_name: faers_api
    restart: unless-stopped
    networks:
      - internal
    # Port NOT exposed to host — Caddy proxies internally on port 8000
    env_file: .env
    environment:
      # Override env-file values so services resolve by container name
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ----------------------------------------------------------------
  # Next.js Frontend — production standalone image
  # ----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL is baked into the JS bundle at build time.
        # It must point to where clients (browsers) reach the API —
        # i.e. via Caddy, not the internal container address.
        NEXT_PUBLIC_API_URL: "https://${APP_DOMAIN}/api/v1"
    image: faers-frontend:prod
    container_name: faers_frontend
    restart: unless-stopped
    networks:
      - internal
    # Port NOT exposed to host — Caddy proxies internally on port 3000
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ----------------------------------------------------------------
  # Caddy — TLS-terminating reverse proxy (Let's Encrypt)
  # ----------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: faers_caddy
    restart: unless-stopped
    networks:
      - internal   # Can reach api:8000 and frontend:3000
      - edge       # Faces the internet
    ports:
      - "80:80"    # Required for ACME HTTP-01 challenge & HTTP→HTTPS redirect
      - "443:443"  # HTTPS
      - "443:443/udp"  # HTTP/3 (QUIC)
    environment:
      # Set APP_DOMAIN in your .env, e.g.: APP_DOMAIN=faers.example.com
      APP_DOMAIN: "${APP_DOMAIN}"
      # Optional: ACME_EMAIL=you@example.com (for cert expiry notices)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro   # Config — read-only
      - caddy_data:/data                       # ACME certs & keys (persist!)
      - caddy_config:/config                   # Caddy runtime config cache
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:    # Must persist across restarts — holds TLS certificates
  caddy_config:
