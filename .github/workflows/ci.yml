# ==============================================================================
# GitHub Actions — CI: Tests & Build (Pull Requests + pushes to non-main)
#
# Runs on every pull request targeting main.
# Set this as a required status check in:
#   GitHub → Settings → Branches → Branch protection rules → main
#
# Jobs:
#   backend-tests  — ruff lint, mypy, pytest (unit + integration, skip slow)
#   frontend-build — npm ci, tsc --noEmit, next build
#
# No AWS credentials — this workflow never touches AWS.
# The deploy.yml workflow handles pushes to main.
# ==============================================================================

name: CI — Tests & Build

on:
  pull_request:
    branches: [main]
  # Allow manual triggers from the Actions UI
  workflow_dispatch:

# Cancel in-progress runs for the same PR when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Backend — Lint, Type-check, Tests
  # ============================================================================
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (prod + dev extras)
        run: pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy api/ nlp/

      - name: Run unit & integration tests
        # -m "not slow" skips tests that require a live DB or real LLM call.
        # All fixtures in conftest.py use MagicMock — no external services needed.
        run: |
          pytest -m "not slow" \
            --tb=short \
            --cov=api \
            --cov=nlp \
            --cov=analytics \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ============================================================================
  # Job 2: Frontend — Type-check + Build
  # ============================================================================
  frontend-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build (next build)
        # next build exercises TypeScript, page generation, and standalone
        # output — validates the Docker image will build without errors.
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://placeholder.example.com/api/v1"
          NEXT_TELEMETRY_DISABLED: "1"
