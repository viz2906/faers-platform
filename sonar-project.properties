# SonarCloud/SonarQube Project Configuration
# ─────────────────────────────────────────────────────────────────────────────

# Unique project key and organization on SonarCloud
sonar.organization=viz2906
sonar.projectKey=viz2906_faers-platform
sonar.projectName=faers-platform

# Path to source and test directories
sonar.sources=api,nlp,analytics,frontend/src
sonar.tests=tests

# Language specific configs
sonar.python.version=3.12
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Exclusions (exclude data, docs, terraform, node_modules)
sonar.exclusions=faersdata/**/*,data/**/*,docs/**/*,terraform/**/*,node_modules/**/*,frontend/node_modules/**/*,frontend/.next/**/*
