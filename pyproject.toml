[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faers-platform"
version = "1.0.0"
description = "FDA FAERS Analytics Platform with Natural Language Query"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pyarrow==16.0.0",
    "psycopg2-binary==2.9.9",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "duckdb==0.10.3",
    "redis==5.0.4",
    "openai==1.30.1",
    "anthropic==0.28.0",
    "tiktoken==0.7.0",
    "sqlparse==0.5.0",
    "sqlglot==23.12.2",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "scipy==1.13.0",
    "tqdm==4.66.4",
    "loguru==0.7.2",
    "rich==13.7.1",
    "apscheduler==3.10.4",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E701", "E722", "F841"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.setuptools]
packages = ["api", "nlp", "analytics", "ingestion"]
