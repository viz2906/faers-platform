# pytest.ini — FAERS Analytics Platform Test Configuration
[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers (prevents "unknown marker" warnings)
markers =
    unit: Unit tests — fast, no external dependencies
    integration: Integration tests — uses TestClient, mocked DB/LLM
    consistency: Anti-hallucination consistency tests
    slow: Slower tests (e.g. actual DB or LLM calls — skip in CI with -m "not slow")

# Output verbosity
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    -q

# Coverage (when run with pytest-cov)
# Run: pytest --cov=api --cov=nlp --cov-report=term-missing --cov-report=html
